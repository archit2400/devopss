name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Docker CI/CD"]   # ✅ fixed
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull archit2400/node-app:latest
            docker rm -f node-app || true
            docker run -d -p 4000:3000 --name node-app archit2400/node-app:latest